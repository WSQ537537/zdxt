<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智答星途 · 星际探索版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== 星际设计令牌 ========== */
:root {
  --deep-space: #030508;
  --nebula-purple: #1a0a2e;
  --nebula-blue: #0a1628;
  --star-white: #e8f4f8;
  --cosmic-cyan: #00d4ff;
  --plasma-pink: #ff6b9d;
  --solar-gold: #ffd700;
  --void-black: #000000;
  --glass-border: rgba(0, 212, 255, 0.15);
  --glass-bg: rgba(10, 22, 40, 0.6);
  --holo-glow: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.1);
  --planet-shadow: 0 0 60px rgba(0, 212, 255, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--deep-space);
  color: var(--star-white);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ========== 深空星云背景 ========== */
#starfield {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
}
#starfield canvas { display: block; }

.nebula-layer {
  position: fixed; inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 80%, rgba(138, 43, 226, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 107, 157, 0.04) 0%, transparent 70%);
  animation: nebulaDrift 30s ease-in-out infinite alternate;
}
@keyframes nebulaDrift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-2%, 1%) scale(1.02); }
  100% { transform: translate(1%, -1%) scale(1.01); }
}

/* ========== 扫描线覆盖层 ========== */
.scanlines {
  position: fixed; inset: 0;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 212, 255, 0.015) 2px,
    rgba(0, 212, 255, 0.015) 4px
  );
}

/* ========== 主容器 ========== */
#mainStage {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

/* ========== 顶部全息导航 ========== */
.holo-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: linear-gradient(180deg, rgba(3,5,8,0.9) 0%, rgba(3,5,8,0.4) 70%, transparent 100%);
  backdrop-filter: blur(12px);
}
.holo-brand {
  font-family: 'Orbitron', monospace;
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--cosmic-cyan), var(--plasma-pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.holo-download {
  padding: 10px 24px;
  border: 1px solid var(--cosmic-cyan);
  background: rgba(0, 212, 255, 0.1);
  color: var(--cosmic-cyan);
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.holo-download::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
  transition: left 0.5s ease;
}
.holo-download:hover::before { left: 100%; }
.holo-download:hover {
  background: rgba(0, 212, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

/* ========== 中央星球系统 ========== */
.planet-system {
  position: relative;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1;
  margin: 80px auto 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 轨道环 */
.orbit-ring {
  position: absolute;
  border: 1px solid rgba(0, 212, 255, 0.1);
  border-radius: 50%;
  animation: orbitRotate linear infinite;
}
.orbit-ring:nth-child(1) {
  width: 90%; height: 90%;
  animation-duration: 60s;
  border-color: rgba(0, 212, 255, 0.08);
}
.orbit-ring:nth-child(2) {
  width: 70%; height: 70%;
  animation-duration: 40s;
  animation-direction: reverse;
  border-color: rgba(255, 107, 157, 0.06);
}
.orbit-ring:nth-child(3) {
  width: 50%; height: 50%;
  animation-duration: 25s;
  border-color: rgba(255, 215, 0, 0.05);
}
@keyframes orbitRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* 主星球 */
.planet-core {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 35%, rgba(0, 212, 255, 0.8) 0%, transparent 50%),
    radial-gradient(circle at 65% 65%, rgba(255, 107, 157, 0.6) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.4) 0%, transparent 70%),
    linear-gradient(135deg, #0a1628, #1a0a2e);
  box-shadow:
    0 0 60px rgba(0, 212, 255, 0.3),
    0 0 120px rgba(138, 43, 226, 0.15),
    inset -20px -20px 60px rgba(0, 0, 0, 0.6),
    inset 10px 10px 40px rgba(255, 255, 255, 0.05);
  animation: planetPulse 4s ease-in-out infinite;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.planet-core::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(0, 212, 255, 0.2);
  animation: planetPulse 4s ease-in-out infinite 0.5s;
}
@keyframes planetPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(0, 212, 255, 0.3), 0 0 120px rgba(138, 43, 226, 0.15); }
  50% { transform: scale(1.03); box-shadow: 0 0 80px rgba(0, 212, 255, 0.4), 0 0 150px rgba(138, 43, 226, 0.2); }
}

.planet-logo {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  object-fit: cover;
  filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
}

/* 星球标签 */
.planet-label {
  position: absolute;
  bottom: -50px;
  text-align: center;
  font-family: 'Orbitron', monospace;
}
.planet-label h1 {
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--cosmic-cyan), var(--plasma-pink), var(--solar-gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 4px;
}
.planet-label p {
  font-size: 11px;
  color: rgba(232, 244, 248, 0.5);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-top: 8px;
}

/* ========== 轨道卫星（角色选择器） ========== */
.satellites {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.satellite {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: var(--cosmic-cyan);
  letter-spacing: 1px;
  cursor: pointer;
  pointer-events: auto;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
}
.satellite:hover, .satellite.active {
  transform: scale(1.2);
  border-color: var(--cosmic-cyan);
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
  background: rgba(0, 212, 255, 0.1);
}
.satellite.admin { top: 5%; left: 50%; transform: translateX(-50%); }
.satellite.student { bottom: 15%; left: 8%; }
.satellite.parent { bottom: 15%; right: 8%; }
.satellite.active.admin { transform: translateX(-50%) scale(1.2); }

/* ========== 全息信息面板 ========== */
.holo-panel {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 40px;
  padding: 24px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  position: relative;
  overflow: hidden;
}
.holo-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cosmic-cyan), transparent);
  opacity: 0.6;
}
.holo-panel::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100px; height: 100px;
  border-left: 1px solid var(--cosmic-cyan);
  border-top: 1px solid var(--cosmic-cyan);
  opacity: 0.3;
}
.holo-corner-br {
  position: absolute;
  bottom: 0; right: 0;
  width: 100px; height: 100px;
  border-right: 1px solid var(--cosmic-cyan);
  border-bottom: 1px solid var(--cosmic-cyan);
  opacity: 0.3;
}

.holo-title {
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  color: var(--cosmic-cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.holo-title::before {
  content: '◆';
  color: var(--plasma-pink);
  font-size: 10px;
}
.holo-text {
  font-size: 14px;
  line-height: 1.8;
  color: rgba(232, 244, 248, 0.7);
}

/* ========== 3D旋转卡片星系 ========== */
.galaxy-section {
  width: 100%;
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}
.galaxy-header {
  text-align: center;
  margin-bottom: 40px;
}
.galaxy-header h2 {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--cosmic-cyan);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.galaxy-header .galaxy-line {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cosmic-cyan), transparent);
  margin: 0 auto;
}

/* 3D卡片容器 */
.card-constellation {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 20px 10px 40px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  perspective: 1200px;
}
.card-constellation::-webkit-scrollbar { display: none; }

/* 单张3D卡片 */
.star-card {
  flex: 0 0 280px;
  height: 380px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  scroll-snap-align: center;
  cursor: pointer;
}
.star-card:hover {
  transform: translateY(-10px) rotateY(5deg) rotateX(-3deg);
}

.star-card-face {
  position: absolute;
  inset: 0;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.star-card-face::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cosmic-cyan), var(--plasma-pink), transparent);
  opacity: 0.5;
}

/* 卡片图片区 */
.card-nebula {
  height: 200px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.05), rgba(255, 107, 157, 0.05));
}
.card-nebula img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.star-card:hover .card-nebula img {
  transform: scale(1.1);
}
.card-nebula::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, var(--glass-bg) 100%);
}

/* 卡片内容 */
.card-data {
  padding: 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-data h3 {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  color: var(--cosmic-cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.card-data p {
  font-size: 12px;
  line-height: 1.6;
  color: rgba(232, 244, 248, 0.6);
  flex: 1;
}
.card-meta {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.data-tag {
  padding: 4px 10px;
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 4px;
  font-size: 10px;
  font-family: 'Orbitron', monospace;
  color: var(--cosmic-cyan);
  letter-spacing: 1px;
}

/* ========== 导航箭头 ========== */
.nav-warp {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
.warp-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: var(--cosmic-cyan);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}
.warp-btn:hover {
  border-color: var(--cosmic-cyan);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
  transform: scale(1.1);
}

/* ========== 底部传送门 ========== */
.warp-gate {
  width: 100%;
  max-width: 600px;
  margin: 60px auto 40px;
  padding: 30px;
  text-align: center;
  position: relative;
}
.warp-gate::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  z-index: -1;
}
.warp-gate h3 {
  font-family: 'Orbitron', monospace;
  font-size: 16px;
  color: var(--cosmic-cyan);
  letter-spacing: 3px;
  margin-bottom: 16px;
}
.warp-gate-btn {
  display: inline-block;
  padding: 14px 48px;
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(255, 107, 157, 0.2));
  border: 1px solid var(--cosmic-cyan);
  color: var(--cosmic-cyan);
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
}
.warp-gate-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
  transition: left 0.6s ease;
}
.warp-gate-btn:hover::before { left: 100%; }
.warp-gate-btn:hover {
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
  transform: translateY(-2px);
}

/* ========== 页脚 ========== */
.cosmic-footer {
  text-align: center;
  padding: 40px 20px;
  color: rgba(232, 244, 248, 0.3);
  font-size: 11px;
  letter-spacing: 2px;
  font-family: 'Orbitron', monospace;
}

/* ========== 弹窗星图 ========== */
.star-map {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(3, 5, 8, 0.95);
  backdrop-filter: blur(20px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.star-map.show {
  display: flex;
  opacity: 1;
}
.star-map-img {
  max-width: 900px;
  max-height: 80vh;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  box-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
}
.star-map-close {
  position: absolute;
  top: 20px; right: 20px;
  width: 44px; height: 44px;
  border: 1px solid var(--glass-border);
  border-radius: 50%;
  background: var(--glass-bg);
  color: var(--cosmic-cyan);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}
.star-map-close:hover {
  border-color: var(--plasma-pink);
  color: var(--plasma-pink);
  transform: rotate(90deg);
}

/* ========== 移动端适配 ========== */
@media (max-width: 768px) {
  .holo-nav { padding: 12px 16px; }
  .holo-brand { font-size: 14px; letter-spacing: 2px; }
  .holo-download { padding: 8px 16px; font-size: 10px; }

  .planet-system {
    max-width: 320px;
    margin: 60px auto 30px;
  }
  .planet-core {
    width: 140px;
    height: 140px;
  }
  .planet-logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
  }
  .planet-label h1 {
    font-size: 18px;
    letter-spacing: 2px;
  }
  .planet-label p {
    font-size: 9px;
    letter-spacing: 3px;
  }

  .satellite {
    width: 48px;
    height: 48px;
    font-size: 9px;
  }
  .satellite.admin { top: 2%; }
  .satellite.student { bottom: 10%; left: 5%; }
  .satellite.parent { bottom: 10%; right: 5%; }

  .holo-panel {
    padding: 16px;
    margin-bottom: 30px;
  }
  .holo-title { font-size: 12px; }
  .holo-text { font-size: 13px; }

  .star-card {
    flex: 0 0 240px;
    height: 340px;
  }
  .card-nebula { height: 160px; }

  .galaxy-header h2 {
    font-size: 16px;
    letter-spacing: 2px;
  }

  .warp-gate {
    margin: 40px auto 20px;
    padding: 20px;
  }
  .warp-gate-btn {
    padding: 12px 36px;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .star-card {
    flex: 0 0 220px;
    height: 320px;
  }
  .card-nebula { height: 140px; }
}
</style>
</head>
<body>

<!-- 星空画布 -->
<div id="starfield"><canvas id="starCanvas"></canvas></div>
<div class="nebula-layer"></div>
<div class="scanlines"></div>

<!-- 全息导航 -->
<nav class="holo-nav">
  <div class="holo-brand">智答星途</div>
  <button class="holo-download" onclick="startDownload()">
    <span class="btn-text">下载应用</span>
    <span class="btn-loading" style="display:none;">加速中...</span>
  </button>
</nav>

<!-- 主舞台 -->
<div id="mainStage">

  <!-- 中央星球系统 -->
  <div class="planet-system">
    <div class="orbit-ring"></div>
    <div class="orbit-ring"></div>
    <div class="orbit-ring"></div>

    <div class="satellites">
      <div class="satellite admin active" data-role="admin" onclick="switchRole('admin')">管理</div>
      <div class="satellite student" data-role="student" onclick="switchRole('student')">学生</div>
      <div class="satellite parent" data-role="parent" onclick="switchRole('parent')">家长</div>
    </div>

    <div class="planet-core" onclick="scrollToContent()">
      <img src="images/logo-source.jpg" alt="智答星途" class="planet-logo">
    </div>

    <div class="planet-label">
      <h1>智答星途</h1>
      <p>一体化智慧教育平台</p>
    </div>
  </div>

  <!-- 全息信息面板 -->
  <div class="holo-panel">
    <div class="holo-corner-br"></div>
    <div class="holo-title">系统概览</div>
    <div class="holo-text">
      智答星途是一款面向教育场景的综合型移动端应用，划分管理员、学生、家长三类使用角色。
      应用整合在线考试、视频学习、智能AI助手、消息通知、意见反馈、课堂签到、数据统计等多项能力，
      覆盖试卷创建发布、课程资源管理、日常学习作答、学情监护、账号安全维护等全流程需求。
    </div>
  </div>

  <!-- 管理员端星系 -->
  <section class="galaxy-section" id="admin-galaxy">
    <div class="galaxy-header">
      <h2>管理员端 · 指挥中心</h2>
      <div class="galaxy-line"></div>
    </div>
    <div class="card-constellation" id="admin-cards">
      <!-- 卡片由JS动态生成 -->
    </div>
    <div class="nav-warp">
      <button class="warp-btn" onclick="scrollConstellation('admin-cards', -1)">&#8249;</button>
      <button class="warp-btn" onclick="scrollConstellation('admin-cards', 1)">&#8250;</button>
    </div>
  </section>

  <!-- 学生端星系 -->

<script>
// ========== 星空粒子系统 ==========
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Star {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 1.5 + 0.3;
    this.speedX = (Math.random() - 0.5) * 0.1;
    this.speedY = (Math.random() - 0.5) * 0.1;
    this.brightness = Math.random();
    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.brightness += this.twinkleSpeed;
    if (this.brightness > 1 || this.brightness < 0.2) this.twinkleSpeed *= -1;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    const alpha = 0.3 + this.brightness * 0.7;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(232, 244, 248, ${alpha})`;
    ctx.fill();
    if (this.size > 1) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232, 244, 248, ${alpha * 0.1})`;
      ctx.fill();
    }
  }
}

class ShootingStar {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = 0;
    this.length = Math.random() * 80 + 40;
    this.speed = Math.random() * 8 + 4;
    this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
    this.life = 1;
    this.active = false;
  }
  trigger() {
    this.active = true;
    this.reset();
  }
  update() {
    if (!this.active) return;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.life -= 0.015;
    if (this.life <= 0 || this.x > canvas.width || this.y > canvas.height) {
      this.active = false;
    }
  }
  draw() {
    if (!this.active) return;
    const tailX = this.x - Math.cos(this.angle) * this.length;
    const tailY = this.y - Math.sin(this.angle) * this.length;
    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0, `rgba(0, 212, 255, ${this.life})`);
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// 初始化星星
for (let i = 0; i < 200; i++) stars.push(new Star());
for (let i = 0; i < 3; i++) shootingStars.push(new ShootingStar());

let frameCount = 0;
function animateStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(star => { star.update(); star.draw(); });
  shootingStars.forEach(ss => { ss.update(); ss.draw(); });

  frameCount++;
  if (frameCount % 300 === 0) {
    const inactive = shootingStars.find(ss => !ss.active);
    if (inactive) inactive.trigger();
  }

  requestAnimationFrame(animateStars);
}
animateStars();

// ========== 渲染卡片 ==========
function renderCards(role, containerId) {
  const container = document.getElementById(containerId);
  const cards = cardData[role] || [];
  container.innerHTML = cards.map(card => `
    <div class="star-card" onclick="openStarMap('images/${card.img}', '${card.title}')">
      <div class="star-card-face">
        <div class="card-nebula">
          <img src="images/${card.img}" alt="${card.title}" loading="lazy" decoding="async">
        </div>
        <div class="card-data">
          <h3>${card.title}</h3>
          <p>${card.desc}</p>
          <div class="card-meta">
            ${card.tags.map(tag => `<span class="data-tag">${tag}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

renderCards('admin', 'admin-cards');
renderCards('student', 'student-cards');
renderCards('parent', 'parent-cards');
renderCards('common', 'common-cards');

// ========== 角色切换 ==========
function switchRole(role) {
  document.querySelectorAll('.satellite').forEach(s => s.classList.remove('active'));
  document.querySelector(`.satellite[data-role="${role}"]`).classList.add('active');

  const target = document.getElementById(role + '-galaxy');
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function scrollToContent() {
  document.getElementById('admin-galaxy').scrollIntoView({ behavior: 'smooth' });
}

// ========== 卡片滚动导航 ==========
function scrollConstellation(containerId, direction) {
  const container = document.getElementById(containerId);
  const cardWidth = 300;
  container.scrollBy({ left: direction * cardWidth, behavior: 'smooth' });
}

// ========== 星图弹窗 ==========
function openStarMap(src, title) {
  const map = document.getElementById('starMap');
  const img = document.getElementById('starMapImg');
  img.src = src;
  img.alt = title;
  map.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeStarMap(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('starMap').classList.remove('show');
  document.body.style.overflow = '';
}

// ========== 下载功能 ==========
async function startDownload() {
  const btn = document.querySelector('.holo-download, .warp-gate-btn');
  if (!btn) return;

  const originalText = btn.innerHTML;
  btn.innerHTML = '<span>⚡ 加速中...</span>';
  btn.disabled = true;

  await new Promise(r => setTimeout(r, 800));

  const link = document.createElement('a');
  link.href = 'zdxt.apk';
  link.download = 'zdxt.apk';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  btn.innerHTML = '<span>✓ 下载已开始</span>';
  setTimeout(() => {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }, 2000);
}

// ========== 滚动渐入动画 ==========
const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      entry.target.style.transform = 'translateY(0)';
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.galaxy-section').forEach(section => {
  section.style.opacity = '0';
  section.style.transform = 'translateY(40px)';
  section.style.transition = 'opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
  fadeObserver.observe(section);
});

// ========== 触摸滑动支持 ==========
document.querySelectorAll('.card-constellation').forEach(container => {
  let startX = 0;
  let scrollLeft = 0;

  container.addEventListener('touchstart', (e) => {
    startX = e.touches[0].pageX - container.offsetLeft;
    scrollLeft = container.scrollLeft;
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    const x = e.touches[0].pageX - container.offsetLeft;
    const walk = (x - startX) * 1.5;
    container.scrollLeft = scrollLeft - walk;
  }, { passive: true });
});
